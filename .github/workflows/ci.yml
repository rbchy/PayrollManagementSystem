# Payroll Management System — CI
#   test    : JUnit 5 tests against a real MySQL 8 service (schema from db/setup_payroll_db.sql)
#   package : builds the runnable fat JAR and checks that it starts its main class
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + SQL + MySQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PAYROLL_DB_URL: jdbc:mysql://127.0.0.1:3306/payroll_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create payroll_db schema, app user and sample rows
        run: |
          mysql -h 127.0.0.1 -uroot -proot < db/setup_payroll_db.sql
          mysql -h 127.0.0.1 -uadmin -padmin123 payroll_db -e "SELECT employee_id, first_name, last_name FROM employees"

      - name: Run tests (headless)
        run: mvn -B -ntp test -Djava.awt.headless=true

      - name: Database tests must have run (not skipped)
        if: always() && hashFiles('target/surefire-reports/TEST-com.payroll.EmployeeSqlIntegrationTest.xml') != ''
        run: |
          f=target/surefire-reports/TEST-com.payroll.EmployeeSqlIntegrationTest.xml
          grep -o '<testsuite [^>]*' "$f"
          grep -q 'skipped="0"' "$f"

      - name: Test summary
        if: always()
        run: |
          echo "| Suite | Tests | Failures | Errors | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .xml | sed 's/TEST-com.payroll.//')
            a=$(grep -o '<testsuite [^>]*' "$f")
            g() { echo "$a" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            echo "| $n | $(g tests) | $(g failures) | $(g errors) | $(g skipped) |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for f in target/surefire-reports/*.txt; do grep -A3 "FAILURE\|ERROR" "$f" | head -20; done || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  package:
    name: Build runnable JAR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -DskipTests package
      - name: JAR manifest points at a real main class
        run: |
          jar=$(ls target/payroll-system-*.jar | grep -v original | head -1)
          main=$(unzip -p "$jar" META-INF/MANIFEST.MF | grep Main-Class | cut -d' ' -f2 | tr -d '\r')
          echo "Main-Class: $main"
          unzip -l "$jar" | grep -q "${main//.//}.class"
      - uses: actions/upload-artifact@v4
        with:
          name: payroll-system-jar
          path: target/payroll-system-*.jar
